  :root {
    --bg: #10141a; --fg: #eae6dc; --accent: #b08a4e;
    --paper: var(--fg); --ink: var(--bg);
    --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef0ef; --fg: #14181d; --accent: #93733c;
      --paper: var(--bg); --ink: var(--fg);
      --shadow: rgba(20, 24, 29, 0.28);
      color-scheme: light; }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font-family: "SG", -apple-system, "Segoe UI", sans-serif; color: var(--fg); overflow: hidden; }

  canvas#c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  main {
    position: fixed; left: 0; bottom: 0; z-index: 2;
    max-width: 430px;
    padding: clamp(24px, 6vw, 64px);
    padding-bottom: calc(clamp(24px, 6vw, 64px) + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 1.15em;
  }
  h1 { margin: 0; font-weight: 500; font-size: clamp(1.55rem, 1.05rem + 2vw, 2.35rem);
    line-height: 1.12; letter-spacing: -0.01em; }
  p { margin: 0; font-weight: 300; font-size: clamp(1rem, 0.94rem + 0.3vw, 1.1rem);
    line-height: 1.5; max-width: 30ch; opacity: 0.74; }
  nav { display: flex; gap: 1.4em; flex-wrap: wrap; }
  nav a { font-weight: 500; font-size: 0.95rem; color: var(--fg); text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
    padding-bottom: 0.15em; transition: border-color 0.2s ease; }
  nav a:hover { border-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 1px; }

  /* ---- the cube ---- */
  #stage {
    --s: clamp(140px, 24vmin, 240px);
    position: fixed; z-index: 1;
    top: 46%; left: 66%;
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    perspective: calc(var(--s) * 4.5);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: grab; display: block;
  }
  #stage.dragging { cursor: grabbing; }
  #stage:focus-visible { outline: 2px solid var(--accent); outline-offset: calc(var(--s) * 0.4); border-radius: 2px; }

  /* contact shadow: grounds the cube so it reads as an object, strongest in light mode */
  #floor {
    position: absolute; left: 50%; top: 100%;
    width: calc(var(--s) * 1.5); height: calc(var(--s) * 0.32);
    margin: calc(var(--s) * 0.3) 0 0 calc(var(--s) * -0.75);
    background: radial-gradient(closest-side, var(--shadow), transparent);
    pointer-events: none;
  }

  #cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform;
    transform: rotateX(-20deg) rotateY(-28deg); /* rest pose without JS */ }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--accent);
  }
  .face svg { display: block; width: 100%; height: 100%; }
  .shade { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
  .front  { transform: translateZ(calc(var(--s) / 2)); }
  .back   { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
  .right  { transform: rotateY(90deg)  translateZ(calc(var(--s) / 2)); }
  .left   { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
  .top    { transform: rotateX(90deg)  translateZ(calc(var(--s) / 2)); }
  .bottom { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }

  @media (max-width: 700px) {
    #stage { --s: clamp(130px, 50vw, 210px); left: 50%; top: calc(50% - 105px); }
    main { max-width: 100%; padding-right: 28px; }
  }
</style>

<script>
/* ---------- background: reach vs. impact ---------- */
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext("2d", { alpha: false });
  var DPR = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, SAFE;
  var stillMode = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function readColors() {
    var s = getComputedStyle(document.documentElement);
    return { bg: s.getPropertyValue("--bg").trim(), fg: s.getPropertyValue("--fg").trim(), accent: s.getPropertyValue("--accent").trim() };
  }
  var colors = readColors(), reach = [], impacts = [];
  function inSafe(x, y) { return x > SAFE.x && x < SAFE.x + SAFE.w && y > SAFE.y && y < SAFE.y + SAFE.h; }
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    SAFE = { x: 0, y: H * 0.52, w: Math.min(560, W * 0.72), h: H * 0.48 };
    if (stillMode) drawStill();
  }
  function spawnReach(t) {
    if (reach.length > 150) return;
    reach.push({ x: Math.random() * W, y: Math.random() * H, born: t, life: 700 + Math.random() * 500, r: 1.1 + Math.random() * 1.3 });
  }
  function spawnImpact(t) {
    var x, y, n = 0;
    do { x = Math.random() * W; y = Math.random() * H; n++; } while (inSafe(x, y) && n < 12);
    impacts.push({ x: x, y: y, born: t, life: 4600 + Math.random() * 2400, rMax: Math.min(W, H) * (0.22 + Math.random() * 0.16) });
  }
  function draw(t) {
    ctx.fillStyle = colors.bg; ctx.fillRect(0, 0, W, H);
    for (var i = reach.length - 1; i >= 0; i--) {
      var e = reach[i], age = t - e.born;
      if (age > e.life) { reach.splice(i, 1); continue; }
      var p = age / e.life, a = p < 0.25 ? p / 0.25 : (p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1);
      ctx.globalAlpha = a * 0.4; ctx.fillStyle = colors.fg;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    }
    for (var j = impacts.length - 1; j >= 0; j--) {
      var m = impacts[j], age2 = t - m.born;
      if (age2 > m.life) { impacts.splice(j, 1); continue; }
      var p2 = age2 / m.life, eased = 1 - Math.pow(1 - p2, 2);
      ctx.globalAlpha = (1 - p2) * 0.36; ctx.strokeStyle = colors.accent; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(m.x, m.y, eased * m.rMax, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawStill() {
    reach = []; impacts = [];
    for (var k = 0; k < 24; k++) reach.push({ x: Math.random() * W, y: Math.random() * H, born: -360, life: 900, r: 1.2 + Math.random() * 1.2 });
    impacts.push({ x: W * 0.3, y: H * 0.25, born: -1800, life: 5200, rMax: Math.min(W, H) * 0.3 });
    draw(0);
  }
  var to; window.addEventListener("resize", function () { clearTimeout(to); to = setTimeout(resize, 150); });
  resize();
  if (!stillMode) {
    var raf = null, lastReach = 0, reachGap = 200, lastImpact = 1400, impactGap = 6000 + Math.random() * 6000;
    var frame = function (now) {
      if (now - lastReach > reachGap) { spawnReach(now); lastReach = now; reachGap = 160 + Math.random() * 220; }
      if (now - lastImpact > impactGap) { spawnImpact(now); lastImpact = now; impactGap = 6000 + Math.random() * 6000; }
      draw(now); raf = requestAnimationFrame(frame);
    };
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
      else if (!raf) raf = requestAnimationFrame(frame);
    });
    raf = requestAnimationFrame(frame);
  }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    colors = readColors(); if (stillMode) draw(0);
  });
})();

/* ---------- the cube ---------- */
(function () {
  "use strict";
  var stage = document.getElementById("stage"), cube = document.getElementById("cube");
  if (!stage || !cube) return;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var shades = {};
  ["front", "back", "right", "left", "top", "bottom"].forEach(function (n) {
    shades[n] = cube.querySelector("." + n + " .shade");
  });

  function mul(a, b) {
    return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
            a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];

  function norm(a) { var l = Math.hypot(a[0], a[1], a[2], a[3]) || 1; return [a[0]/l, a[1]/l, a[2]/l, a[3]/l]; }
  function axis(x, y, z, ang) { var s = Math.sin(ang / 2); return [Math.cos(ang / 2), x * s, y * s, z * s]; }
  var DEG = Math.PI / 180;

  // rest pose = the same rotateX(..) rotateY(..) the CSS uses when JS is off
  var Q0 = mul(axis(1, 0, 0, -20 * DEG), axis(0, 1, 0, -28 * DEG));
  var q = Q0.slice(), wx = 0, wy = 0;
  var dragging = false, wasDrag = false, startX = 0, startY = 0, lastX = 0, lastY = 0, lastT = 0;
  var lastTouch = -1e9, raf = null;
  var SENS = 0.009, SETTLE_DELAY = 1400;

  var canHover = !reduce && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var hx = 0, hy = 0, tx = 0, ty = 0, HOVER = 0.12; // ~7deg toward the cursor

  // idle drift: three incommensurate sines, a few degrees each — alive, never a visible loop
  function restPose(t) {
    if (reduce) return Q0;
    var yaw = 0.07 * Math.sin(t * 0.00061) + 0.035 * Math.sin(t * 0.00149 + 1.3);
    var pitch = 0.045 * Math.sin(t * 0.00083 + 0.4);
    var drift = mul(axis(0, 1, 0, yaw), mul(axis(1, 0, 0, pitch), Q0));
    if (!hx && !hy) return drift;

    return mul(axis(0, 1, 0, hx * HOVER), mul(axis(1, 0, 0, -hy * HOVER), drift));

  function spin(ax, ay, ang) { if (ang) q = norm(mul(axis(ax, ay, 0, ang), q)); }
  function toward(target, t) {
    var d = q[0]*target[0] + q[1]*target[1] + q[2]*target[2] + q[3]*target[3];
    var s = d < 0 ? -1 : 1;
    q = norm([0, 1, 2, 3].map(function (i) { return q[i] + (target[i] * s - q[i]) * t; }));
  }

  var L = (function () { var v = [-0.45, -0.6, 0.66], l = Math.hypot(v[0], v[1], v[2]); return [v[0]/l, v[1]/l, v[2]/l]; })();
  function apply() {

    var c0 = [1-2*(y*y+z*z), 2*(x*y+w*z), 2*(x*z-w*y)];   // image of +X (right)
    var c1 = [2*(x*y-w*z), 1-2*(x*x+z*z), 2*(y*z+w*x)];   // image of +Y (bottom)
    var c2 = [2*(x*z+w*y), 2*(y*z-w*x), 1-2*(x*x+y*y)];   // image of +Z (front)
    cube.style.transform = "matrix3d(" + c0.concat(0, c1, 0, c2, 0, 0, 0, 0, 1).join(",") + ")";
    function shade(n, v, sign) {
      var d = sign * (v[0]*L[0] + v[1]*L[1] + v[2]*L[2]);
      shades[n].style.opacity = (0.42 * (1 - Math.max(0, d))).toFixed(3);
    }
    shade("right", c0, 1); shade("left", c0, -1);
    shade("bottom", c1, 1); shade("top", c1, -1);
    shade("front", c2, 1); shade("back", c2, -1);
  }

    hx += (tx - hx) * 0.08; hy += (ty - hy) * 0.08;

  });
  stage.addEventListener("pointermove", function (e) {
    if (!dragging) {
      if (!canHover || e.pointerType !== "mouse") return;
      var r = stage.getBoundingClientRect();
      tx = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1));
      ty = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height * 2 - 1));
      return;
    }
    var now = performance.now(), dt = Math.max(now - lastT, 1);
    var dx = e.clientX - lastX, dy = e.clientY - lastY, len = Math.hypot(dx, dy);
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) wasDrag = true;
    if (len > 0) {
      spin(-dy / len, dx / len, len * SENS);
      if (!reduce) { var k = SENS * 16 / dt; wx = -dy * k; wy = dx * k; }
    }
    lastX = e.clientX; lastY = e.clientY; lastT = lastTouch = now;
  });
  function end() {
    if (!dragging) return;
    dragging = false; lastTouch = performance.now();
    if (performance.now() - lastT > 80) wx = wy = 0;
    stage.classList.remove("dragging"); wake();
  }
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointerleave", function () { tx = ty = 0; });
  stage.addEventListener("pointercancel", end);
  stage.addEventListener("click", function (e) { if (wasDrag) { e.preventDefault(); wasDrag = false; } });
  stage.addEventListener("dragstart", function (e) { e.preventDefault(); });
  stage.addEventListener("keydown", function (e) {
    var map = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [1, 0], ArrowDown: [-1, 0] }[e.key];
    if (!map) return;
    e.preventDefault(); spin(map[0], map[1], 0.3); lastTouch = performance.now(); apply(); wake();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; } else wake();
  });

  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    stage.target = "_blank"; stage.rel = "me noopener";
  }

  apply(); wake();
})();
</script>
