  :root {
    --bg: #10141a; --fg: #eae6dc; --accent: #b08a4e;
    --paper: var(--fg); --ink: var(--bg);
    --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eeece6; --fg: #14181d; --accent: #8f6d36;
      --paper: var(--bg); --ink: var(--fg);
      --shadow: rgba(20, 24, 29, 0.26);
      color-scheme: light; }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: "NR", Georgia, "Times New Roman", serif;
    color: var(--fg); overflow: hidden;
    font-kerning: normal; text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  main {
    position: fixed; left: 0; bottom: 0; z-index: 2;
    max-width: 520px;
    padding: clamp(28px, 6.5vw, 72px);
    padding-bottom: calc(clamp(28px, 6.5vw, 72px) + env(safe-area-inset-bottom, 0px));
  }
  .role {
    margin: 0 0 1.1rem;
    font-size: 0.72rem; letter-spacing: 0.16em;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(2rem, 1.3rem + 2.6vw, 3.1rem);
    line-height: 1.04; letter-spacing: -0.015em;
  }
  .claim {
    margin: 1rem 0 0;
    font-style: italic;
    font-size: clamp(1.08rem, 1rem + 0.35vw, 1.24rem);
    line-height: 1.45; max-width: 26ch;
    opacity: 0.78;
  }
  nav { display: flex; gap: 1.6em; margin-top: 2.1rem; }
  nav a {
    font-size: 1rem; color: var(--fg); text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
    padding-bottom: 0.08em; transition: border-color 0.2s ease, color 0.2s ease;
  }
  nav a:hover { border-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 1px; }

  /* ---- the cube ---- */
  #stage {
    --s: clamp(120px, 20vmin, 200px);
    position: fixed; z-index: 1;
    top: 44%; left: 68%;
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    perspective: calc(var(--s) * 4.5);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: grab; display: block;
  }
  #stage.dragging { cursor: grabbing; }
  #stage:focus-visible { outline: 2px solid var(--accent); outline-offset: calc(var(--s) * 0.4); border-radius: 2px; }
  #floor {
    position: absolute; left: 50%; top: 100%;
    width: calc(var(--s) * 1.5); height: calc(var(--s) * 0.3);
    margin: calc(var(--s) * 0.32) 0 0 calc(var(--s) * -0.75);
    background: radial-gradient(closest-side, var(--shadow), transparent);
    pointer-events: none;
  }
  #cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform;
    transform: rotateX(-20deg) rotateY(-28deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .face svg { display: block; width: 100%; height: 100%; }
  .mono { font-size: calc(var(--s) * 0.34); letter-spacing: -0.02em; line-height: 1; transform: translateY(-3%); }
  .shade { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
  .front  { transform: translateZ(calc(var(--s) / 2)); }
  .back   { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
  .right  { transform: rotateY(90deg)  translateZ(calc(var(--s) / 2)); }
  .left   { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
  .top    { transform: rotateX(90deg)  translateZ(calc(var(--s) / 2)); }
  .bottom { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }

  @media (max-width: 700px) {

<script>
(function () {
  "use strict";
  var stage = document.getElementById("stage"), cube = document.getElementById("cube");
  if (!stage || !cube) return;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canHover = !reduce && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var shades = {};
  ["front", "back", "right", "left", "top", "bottom"].forEach(function (n) {
    shades[n] = cube.querySelector("." + n + " .shade");
  });

  // ---- quaternion helpers [w, x, y, z] ----
  function mul(a, b) {
    return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
            a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
  }
  function conj(a) { return [a[0], -a[1], -a[2], -a[3]]; }
  function norm(a) { var l = Math.hypot(a[0], a[1], a[2], a[3]) || 1; return [a[0]/l, a[1]/l, a[2]/l, a[3]/l]; }
  function axis(x, y, z, ang) { var s = Math.sin(ang / 2); return [Math.cos(ang / 2), x * s, y * s, z * s]; }
  function rotVec(v) { var a = Math.hypot(v[0], v[1], v[2]); if (a > 1e-9) q = norm(mul(axis(v[0]/a, v[1]/a, v[2]/a, a), q)); }
  // world-space rotation vector that carries q onto target
  function errorTo(target) {
    var e = mul(target, conj(q));
    if (e[0] < 0) e = [-e[0], -e[1], -e[2], -e[3]];
    var s = Math.sqrt(Math.max(0, 1 - e[0] * e[0]));
    if (s < 1e-6) return [2 * e[1], 2 * e[2], 2 * e[3]];
    var ang = 2 * Math.acos(Math.min(1, e[0]));
    return [e[1] / s * ang, e[2] / s * ang, e[3] / s * ang];
  }

  var DEG = Math.PI / 180;
  var Q0 = mul(axis(1, 0, 0, -20 * DEG), axis(0, 1, 0, -28 * DEG));  // rest pose (matches CSS)
  var q = Q0.slice();
  var w = [0, 0, 0];                                   // angular velocity, rad/frame, world space
  var hx = 0, hy = 0, tx = 0, ty = 0, HOVER = 0.12;
  var dragging = false, wasDrag = false, startX = 0, startY = 0, lastX = 0, lastY = 0, lastT = 0, dragV = [0, 0, 0];
  var SENS = 0.009;
  // the spring: underdamped on purpose (zeta ~ 0.55) — pushed away, it rights itself
  // with one short overshoot, like something with weight and a stance
  var K = 0.012, C = 0.12;

  function restPose(t) {
    if (reduce) return Q0;
    var yaw = 0.06 * Math.sin(t * 0.00061) + 0.03 * Math.sin(t * 0.00149 + 1.3);
    var pitch = 0.04 * Math.sin(t * 0.00083 + 0.4);
    var p = mul(axis(0, 1, 0, yaw), mul(axis(1, 0, 0, pitch), Q0));
    if (hx || hy) p = mul(axis(0, 1, 0, hx * HOVER), mul(axis(1, 0, 0, -hy * HOVER), p));
    return p;
  }

  var L = (function () { var v = [-0.45, -0.6, 0.66], l = Math.hypot(v[0], v[1], v[2]); return [v[0]/l, v[1]/l, v[2]/l]; })();
  function apply() {
    var W = q[0], x = q[1], y = q[2], z = q[3];
    var c0 = [1-2*(y*y+z*z), 2*(x*y+W*z), 2*(x*z-W*y)];
    var c1 = [2*(x*y-W*z), 1-2*(x*x+z*z), 2*(y*z+W*x)];
    var c2 = [2*(x*z+W*y), 2*(y*z-W*x), 1-2*(x*x+y*y)];
    cube.style.transform = "matrix3d(" + c0.concat(0, c1, 0, c2, 0, 0, 0, 0, 1).join(",") + ")";
    function shade(n, v, sign) {
      var d = sign * (v[0]*L[0] + v[1]*L[1] + v[2]*L[2]);
      shades[n].style.opacity = (0.42 * (1 - Math.max(0, d))).toFixed(3);
    }
    shade("right", c0, 1); shade("left", c0, -1);
    shade("bottom", c1, 1); shade("top", c1, -1);
    shade("front", c2, 1); shade("back", c2, -1);
  }

  var raf = null;
  function tick(now) {
    raf = null;
    hx += (tx - hx) * 0.08; hy += (ty - hy) * 0.08;
    if (!dragging) {
      if (reduce) { q = Q0.slice(); apply(); return; }       // no spring, no drift: settle instantly, stop
      var err = errorTo(restPose(now));
      for (var i = 0; i < 3; i++) w[i] += K * err[i] - C * w[i];
      rotVec(w);
    }
    apply();
    raf = requestAnimationFrame(tick);
  }
  function wake() { if (!raf) raf = requestAnimationFrame(tick); }

  stage.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    stage.setPointerCapture(e.pointerId);
    dragging = true; wasDrag = false;
    startX = lastX = e.clientX; startY = lastY = e.clientY; lastT = performance.now();
    w = [0, 0, 0]; dragV = [0, 0, 0];
    stage.classList.add("dragging"); wake();
  });
  stage.addEventListener("pointermove", function (e) {
    if (!dragging) {
      if (!canHover || e.pointerType !== "mouse") return;
      var r = stage.getBoundingClientRect();
      tx = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1));
      ty = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height * 2 - 1));
      return;
    }
    var now = performance.now(), dt = Math.max(now - lastT, 1);
    var dx = e.clientX - lastX, dy = e.clientY - lastY, len = Math.hypot(dx, dy);
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) wasDrag = true;
    if (len > 0) {
      rotVec([-dy * SENS, dx * SENS, 0]);
      var k = SENS * 16 / dt; dragV = [-dy * k, dx * k, 0];
    }
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  function end() {
    if (!dragging) return;
    dragging = false;
    // a flick carries its momentum into the spring; a held pause doesn't
    w = (!reduce && performance.now() - lastT < 80) ? dragV.map(function (v) { return Math.max(-0.35, Math.min(0.35, v)); }) : [0, 0, 0];
    stage.classList.remove("dragging"); wake();
  }
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
  stage.addEventListener("pointerleave", function () { tx = ty = 0; });
  stage.addEventListener("click", function (e) { if (wasDrag) { e.preventDefault(); wasDrag = false; } });
  stage.addEventListener("dragstart", function (e) { e.preventDefault(); });
  stage.addEventListener("keydown", function (e) {
    var m = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [1, 0], ArrowDown: [-1, 0] }[e.key];
    if (!m) return;
    e.preventDefault();
    if (reduce) return;
    w[0] += m[0] * 0.09; w[1] += m[1] * 0.09; wake();     // a nudge: it tips, then rights itself
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; } else wake();
  });
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    stage.target = "_blank"; stage.rel = "me noopener";
  }

  apply();
  if (!reduce) {
    w = [0.05, -0.11, 0.02];   // entrance: arrives with a small push and settles into its stance
    wake();
  }
})();
